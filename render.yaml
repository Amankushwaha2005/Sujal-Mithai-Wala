services:
  - type: web
    name: sujal-mithai-wala
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: SMW_BIND
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: sujal-mithai-db
          property: connectionString

databases:
  - name: sujal-mithai-db
    databaseName: sujal_mithai
    user: sujal
    plan: free
